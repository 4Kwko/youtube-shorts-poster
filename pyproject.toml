[project]
name = "clipper"
version = "0.1.0"
description = "Transforma vídeos longos em clips verticais para TikTok, Reels e Shorts."
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "fastapi>=0.115",
    "yt-dlp>=2024.8.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "faster-whisper>=1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
# Arquivos gerados pelo template do Alembic.
extend-exclude = ["backend/alembic/versions"]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "S", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # assert é o mecanismo do pytest

[tool.mypy]
exclude = "backend/alembic/versions"
# numpy, transitivo do faster-whisper, publica stubs que exigem 3.12.
python_version = "3.12"
mypy_path = "backend"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# yt-dlp e faster-whisper não distribuem type hints; os adaptadores em
# services/ingest/ytdlp.py e services/transcription/backend.py são a fronteira
# onde isso fica contido.
module = ["yt_dlp", "yt_dlp.*", "faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q"
